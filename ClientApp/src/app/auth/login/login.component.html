<section class="auth-layout">
  <div class="intro">
    <p class="eyebrow">Allen and Kerber Auto Supply Portal</p>
    <h1>Parts move fast.<br><em>Your workflow should too.</em></h1>
    <p>One focused workspace for the people who keep customers, vehicles, and business moving.</p>
  </div>
  <div class="card auth-card">
    <p class="eyebrow">Welcome back</p>
    <h2>Sign in to your account</h2>
    <div class="tabs">
      <button [class.active]="loginMode === 'password'" (click)="loginMode = 'password'">Email</button>
      <button [class.active]="loginMode === 'google'" (click)="loginMode = 'google'">Google</button>
    </div>
    <div *ngIf="loginMode === 'google'"><a class="button primary" href="/auth/external/Google">Continue with Google</a></div>
    <div *ngIf="loginMode === 'password'" class="form">
      <label>Email address<input [(ngModel)]="email" type="email" autocomplete="email" placeholder="name@company.com"></label>
      <label>Password<input [(ngModel)]="password" type="password" autocomplete="current-password" placeholder="Enter your password" (keyup.enter)="passwordLogin()"></label>
      <button class="button primary" type="button" (click)="passwordLogin()">Sign in &rarr;</button>
    </div>
    <p *ngIf="error" class="alert">{{error}}</p>
  </div>
</section>
