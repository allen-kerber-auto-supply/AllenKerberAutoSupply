<section class="narrow">
  <div class="card change-card">
    <p class="eyebrow">Action required</p>
    <h1>Set your new password</h1>
    <p>For your account's security, replace the temporary password before continuing.</p>
    <div class="form">
      <label>Temporary password<input [(ngModel)]="currentPassword" type="password" autocomplete="current-password"></label>
      <label>New password<input [(ngModel)]="newPassword" type="password" autocomplete="new-password" placeholder="At least 12 characters"></label>
      <label>Confirm new password<input [(ngModel)]="confirmPassword" type="password" autocomplete="new-password" (keyup.enter)="changePassword()"></label>
      <button class="button primary" type="button" (click)="changePassword()">Update password</button>
    </div>
    <p *ngIf="error" class="alert">{{error}}</p>
  </div>
</section>
