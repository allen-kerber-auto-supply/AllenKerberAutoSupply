<header><a class="brand" href="/"><img src="/ak-logo.jpg" alt="Allen &amp; Kerber Auto Supply" class="brand-logo"><b>Allen & Kerber<small>Auto Supply</small></b></a><div class="actions"><button class="theme" type="button" (click)="themeToggle.emit()" [attr.aria-label]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'" [title]="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">{{theme === 'dark' ? '☀' : '☾'}}</button><div *ngIf="authenticated" class="menu"><button type="button" (click)="menuOpen=!menuOpen"><i>{{initials}}</i><span>{{name || 'Account'}}</span> &#9662;</button><div *ngIf="menuOpen" class="menu-items"><button *ngIf="canManageUsers" type="button" (click)="adminRequested.emit(); menuOpen=false">User administration</button><button *ngIf="canManageCustomers" type="button" (click)="customerAdminRequested.emit(); menuOpen=false">Invoice Customers</button><button *ngIf="hasDualRoles" type="button" (click)="switchRequested.emit(); menuOpen=false">Switch to {{destination === 'sales' ? 'Invoices' : 'Sales'}}</button><button type="button" (click)="logoutRequested.emit()" [disabled]="signingOut">{{signingOut ? 'Signing out...' : 'Sign out'}}</button></div></div></div></header>
