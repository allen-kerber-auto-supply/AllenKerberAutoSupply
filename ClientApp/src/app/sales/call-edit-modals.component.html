<div *ngIf="completingCall" class="modal-backdrop">
  <form class="card modal" (ngSubmit)="completeRequested.emit()">
    <p class="eyebrow">Complete Call</p><h2>{{completingCall.accountName}}</h2>
    <p>Mark this call as completed, add conversation notes, and optionally set a follow-up date.</p>
    <label>Conversation Notes / Outcome *<textarea [ngModel]="completingComments" (ngModelChange)="completingCommentsChange.emit($event)" name="completeNotes" rows="4" required placeholder="What was discussed during this call?"></textarea></label>
    <label>Schedule Follow-up Date (Optional)<input type="date" [ngModel]="completingFollowUpDate" (ngModelChange)="completingFollowUpDateChange.emit($event)" name="completeFollowUp"><small class="input-hint">If set, a new scheduled call will automatically be created on this date.</small></label>
    <div class="modal-actions"><button class="button secondary" type="button" (click)="closed.emit()">Cancel</button><button class="button primary" type="submit" [disabled]="!completingComments.trim()">Complete Call</button></div>
  </form>
</div>

<div *ngIf="editingCall" class="modal-backdrop">
  <form class="card modal" (ngSubmit)="editRequested.emit()">
    <p class="eyebrow">Edit Call</p><h2>{{editingCall.accountName}}</h2>
    <div class="form-grid-2"><label>Contact Name<input [ngModel]="editingCall.contactName" (ngModelChange)="updateEditingCall('contactName', $event)" name="editContact"></label><label>Phone<input [ngModel]="editingCall.phone" (ngModelChange)="updateEditingCall('phone', $event)" name="editPhone"></label></div>
    <div class="form-grid-2"><label>Call Date<input type="date" [ngModel]="editCallDate" (ngModelChange)="onCallDateChange($event)" name="editCallDate"></label><label>Call Time<input type="time" [ngModel]="editCallTime" (ngModelChange)="onCallTimeChange($event)" name="editCallTime" step="60"></label></div>
    <div class="form-grid-2"><label>Follow-up Date<input type="date" [ngModel]="editingCall.followUpDate" (ngModelChange)="updateEditingCall('followUpDate', $event)" name="editFollowUp"></label><fieldset class="call-duration-field" aria-labelledby="edit-call-duration-legend"><legend id="edit-call-duration-legend">Call Duration</legend><div class="time-parts"><label class="visually-hidden" for="editDurationHours">Call duration hours</label><input id="editDurationHours" type="number" [ngModel]="durationHours" (ngModelChange)="onDurationHoursChange($event)" name="editDurationHours" min="0" max="8" step="1"><span aria-hidden="true">:</span><label class="visually-hidden" for="editDurationMinutes">Call duration minutes</label><input id="editDurationMinutes" type="number" [ngModel]="durationMinutes" (ngModelChange)="onDurationMinutesChange($event)" name="editDurationMinutes" min="0" max="59" step="1"></div><small class="input-hint">Duration cannot exceed 8:00.</small></fieldset></div>
    <label>Status<select [ngModel]="editingCall.status" (ngModelChange)="updateEditingCall('status', $event)" name="editStatus"><option [ngValue]="0">Scheduled / Pending</option><option [ngValue]="1">Completed</option></select></label>
    <label>Notes / Comments<textarea [ngModel]="editingCall.comments" (ngModelChange)="updateEditingCall('comments', $event)" name="editComments" rows="4"></textarea></label>
    <div class="modal-actions"><button class="button secondary" type="button" (click)="closed.emit()">Cancel</button><button class="button primary" type="submit">Save Changes</button></div>
  </form>
</div>
