<div *ngIf="completingCall" class="modal-backdrop">
  <form class="card modal" (ngSubmit)="completeRequested.emit()">
    <p class="eyebrow">Complete Call</p><h2>{{completingCall.accountName}}</h2>
    <p>Mark this call as completed, add conversation notes, and optionally set a follow-up date.</p>
    <label>Conversation Notes / Outcome *<textarea [ngModel]="completingComments" (ngModelChange)="completingCommentsChange.emit($event)" name="completeNotes" rows="2" required placeholder="What was discussed?"></textarea></label>
    <div class="form-grid-2"><label>Call Duration (hours)<input type="number" min="0" max="8" [ngModel]="completingDurationHours" (ngModelChange)="onCompletingDurationHoursChange($event)" name="completeDurationHours"></label><label>Minutes<input type="number" min="0" max="59" [ngModel]="completingDurationMinutes" (ngModelChange)="onCompletingDurationMinutesChange($event)" name="completeDurationMinutes"></label></div>
    <label>Schedule Follow-up Date (Optional)<input type="date" [ngModel]="completingFollowUpDate" (ngModelChange)="completingFollowUpDateChange.emit($event)" name="completeFollowUp"><small class="muted">Leave blank if no follow-up is needed.</small></label>
    <div class="modal-actions"><button class="button secondary" type="button" (click)="closed.emit()">Cancel</button><button class="button primary" type="submit" [disabled]="!completingComments.trim()">Complete Call</button></div>
  </form>
</div>

<div *ngIf="editingCall" class="modal-backdrop">
  <form class="card modal" (ngSubmit)="editRequested.emit()">
    <p class="eyebrow">Edit Call</p><h2>{{editingCall.accountName}}</h2>
    <div class="form-grid-2"><label>Contact Name<input [ngModel]="editingCall.contactName" (ngModelChange)="updateEditingCall('contactName', $event)" name="editContact"></label><label>Phone<input [ngModel]="editingCall.phone" (ngModelChange)="updateEditingCall('phone', $event)" name="editPhone"></label></div>
    <div class="form-grid-2"><label>Call Date<input type="date" [ngModel]="editCallDate" (ngModelChange)="onCallDateChange($event)" name="editCallDate"></label><label>Call Time<input type="time" [ngModel]="editCallTime" (ngModelChange)="onCallTimeChange($event)" name="editCallTime"></label></div>
    <div class="form-grid-2"><label>Call Duration (hours)<input type="number" min="0" max="8" [ngModel]="durationHours" (ngModelChange)="onDurationHoursChange($event)" name="editDurationHours"></label><label>Minutes<input type="number" min="0" max="59" [ngModel]="durationMinutes" (ngModelChange)="onDurationMinutesChange($event)" name="editDurationMinutes"></label></div>
    <label>Follow-up Date<input type="date" [ngModel]="editingCall.followUpDate" (ngModelChange)="updateEditingCall('followUpDate', $event)" name="editFollowUp"></label>
    <label>Status<select [ngModel]="editingCall.status" (ngModelChange)="updateEditingCall('status', $event)" name="editStatus"><option [ngValue]="0">Scheduled / Pending</option><option [ngValue]="1">Completed</option><option [ngValue]="2">Rescheduled</option><option [ngValue]="3">Cancelled</option></select></label>
    <label>Notes / Comments<textarea [ngModel]="editingCall.comments" (ngModelChange)="updateEditingCall('comments', $event)" name="editComments" rows="4"></textarea></label>
    <div class="modal-actions"><button class="button secondary" type="button" (click)="closed.emit()">Cancel</button><button class="button primary" type="submit">Save Changes</button></div>
  </form>
</div>
